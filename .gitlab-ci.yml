variables:
  DOCKER_TARGET_IMAGE: registry.ddbuild.io/ci/datadog-lambda-java
  DOCKER_TARGET_VERSION: latest
  # Default version for development builds
  # This will be overwritten by the tag version if it is a release.
  VERSION: dev
  # Prefills the "Run pipeline" Variables form (GitLab shows keys that have `description`).
  TRACER_VERSION:
    value: ""
    description: "Pin dd-java-agent Maven version (e.g. 1.47.2). Leave empty for latest from dtdg.co."

stages:
  - pre
  - build

.go-cache: &go-cache
  key: datadog-lambda-java-go-cache
  policy: pull

ci image:
  stage: build
  image: registry.ddbuild.io/images/docker:20.10
  tags: ["arch:arm64"]
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - .gitlab/Dockerfile
      when: on_success
    # Allow rebuilding (and re-signing) the image on demand from "Run pipeline".
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  variables:
    DOCKER_TARGET: ${DOCKER_TARGET_IMAGE}:${DOCKER_TARGET_VERSION}
  script:
    - METADATA_FILE=$(mktemp)
    - docker buildx build --platform linux/amd64,linux/arm64 --no-cache --pull --tag ${DOCKER_TARGET} -f .gitlab/Dockerfile --push --metadata-file ${METADATA_FILE} .
    - ddsign sign ${DOCKER_TARGET} --docker-metadata-file ${METADATA_FILE}

generator:
  stage: pre
  image: registry.ddbuild.io/images/mirror/golang:alpine
  tags: ["arch:amd64"]
  cache: *go-cache
  script:
    - if [[ "$CI_COMMIT_TAG" =~ ^v[0-9]+$ ]]; then echo "VERSION=${CI_COMMIT_TAG//[!0-9]/}" >> .env; fi
    - apk add --no-cache gomplate
    - gomplate --config .gitlab/config.yaml
  artifacts:
    paths:
      - .gitlab/build-pipeline.yaml
    reports:
      dotenv: .env

build:
  stage: build
  needs:
    - job: generator
      artifacts: true
  trigger:
    # Ensure Run pipeline / UI overrides of pipeline variables reach the child (with yaml_variables).
    forward:
      pipeline_variables: true
      yaml_variables: true
    include:
      - artifact: .gitlab/build-pipeline.yaml
        job: generator
    strategy: depend
  variables:
    VERSION: $VERSION